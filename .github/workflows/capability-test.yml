name: NVIDIA kids-story capability test

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run capability test
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python capability_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-images
          path: test_*.jpg
          if-no-files-found: ignore
